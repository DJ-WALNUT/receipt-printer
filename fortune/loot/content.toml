arg = "--seed"
pattern = '[Ll]\d{6}'
example = "L482913"
[[mode.field]]
id = "level"
type = "number"
label = "아이템 레벨 (레벨을 정해 뽑았던 경우)"
arg = "--level"
min = 1
max = 30
audience = "staff"
