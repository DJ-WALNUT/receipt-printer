# 키오스크의 겉모습. 여기만 고치면 이름, 색, 글꼴이 바뀐다.
# 고친 뒤 키오스크를 다시 시작한다 (파이: sudo systemctl restart receipt-kiosk).
# 값이 잘못되면 그 항목만 기본값으로 돌아간다.

name = "도파민 박스"            # 화면 맨 위에 보이는 이름

[colors]                        # "#RRGGBB" 형식
board = "#FFD400"               # 판 바탕
board_shade = "#F2C200"         # 뜯긴 칸의 줄무늬
accent = "#E4002B"              # 머리띠와 뽑기 버튼 (흰 글자가 올라간다)
select = "#1E3A8A"              # 고른 칸과 고른 탭 (흰 글자가 올라간다)
ink = "#1A1A1A"                 # 글자와 테두리
paper = "#FFFFFF"               # 칸과 패널 바탕

[fonts]                         # CSS font-family 값. 기기에 없는 글꼴은 뒤의 것으로 넘어간다
display = "'DNF Bit Bit v2', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"            # 이름, 칸 번호, 뽑기 버튼
body = "'Tuktakpotato', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"      # 나머지 전부
