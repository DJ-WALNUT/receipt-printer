<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-180.png">
<title>영수증 뽑기</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body ontouchstart="">
<div class="app">
  <header class="bar">
    <h1 class="bar__name" id="name">영수증 뽑기</h1>
    <div class="bar__side">
      <button type="button" class="bar__button" id="queueButton" hidden>대기열</button>
      <button type="button" class="bar__button" id="logoutButton" hidden>관리자 나가기</button>
      <span class="pill pill--staff" id="staffBadge" hidden>관리자</span>
      <span class="pill" id="status">불러오는 중</span>
    </div>
  </header>

  <main class="main">
    <section class="board" aria-label="뽑을 것 고르기">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="board__scroll">
        <div class="grid" id="grid"></div>
      </div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <footer class="strip" id="strip" aria-live="polite"></footer>
</div>

<div class="overlay" id="overlay" hidden></div>

<noscript>이 화면은 자바스크립트가 켜져 있어야 동작합니다.</noscript>
<script src="/static/app.js"></script>
</body>
</html>
