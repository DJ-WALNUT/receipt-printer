title = "숨은 글자 찾기"
order = 75
seed_prefix = "G"

[[mode]]
id = "new"
label = "새 판"
same_sheets = true
[[mode.field]]
id = "level"
type = "choice"
label = "난이도"
arg = "--level"
choices = [["쉬움", "easy"], ["보통", "medium"], ["어려움", "hard"]]
default = "medium"
[[mode.field]]
id = "count"
type = "number"
label = "숨은 글자 개수"
arg = "--count"
min = 1
max = 3
default = 1

[[mode]]
id = "answer"
label = "정답 인쇄"
sheets = false
[[mode.field]]
id = "number"
type = "text"
label = "시드번호"
arg = "--answer"
pattern = '[Gg][EMHemh][1-3]\d{6}'
example = "GM1482913"
