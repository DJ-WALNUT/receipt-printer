title = "미로찾기"
order = 50
seed_prefix = "Z"

[[mode]]
id = "new"
label = "새 판"
[[mode.field]]
id = "level"
type = "choice"
label = "난이도"
arg = "--level"
choices = [["쉬움", "easy"], ["보통", "medium"], ["어려움", "hard"]]
default = "medium"

[[mode]]
id = "answer"
label = "정답 인쇄"
sheets = false
[[mode.field]]
id = "number"
type = "text"
label = "시드번호"
arg = "--answer"
pattern = '[Zz][EMHemh]\d{6}'
example = "ZM482913"
